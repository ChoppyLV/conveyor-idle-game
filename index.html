const SAVE_KEY="lineBalance_save_v4"; // v4: multi-good belts — splitter/merger/storageroom's `buf` is now a per-good
// object like Smart Splitter's always was (no more single `.good`+scalar `.buf`), and belts carry a `filterGood`
// (Smart Splitter output routing: a specific good, ELSE, or undefined for an unfiltered belt). v3 saves fall
// through to a fresh reset() — same accepted "constants for now" tradeoff as every prior version bump.
function saveGame(){
  try{
    const data={ v:4, savedAt:Date.now(), nextId, battery, techTier, tierProgress, lifetimeDelivered,
      contracts, credits, contractsCompleted, prestigeCount, crossings,
      deposits:deposits.map(d=>({x:d.x,y:d.y,good:d.good,rich:d.rich,discovered:!!d.discovered})),
      nodes:Object.values(nodes).map(b=>({id:b.id,type:b.type,x:b.x,y:b.y,recipeId:b.recipeId,
        tier:b.tier,buf:b.buf,inBuf:b.inBuf,outBuf:b.outBuf,good:b.good})),
      belts:belts.map(be=>({id:be.id,src:be.src,dst:be.dst,good:be.good,filterGood:be.filterGood,path:be.path,cross:be.cross,tier:be.tier})) };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){ /* storage unavailable — silently skip, game still runs in-memory */ }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function offlineCatchUp(elapsedSec){
  const capped=Math.max(0,Math.min(elapsedSec,CFG.offlineCapSec));
  if(capped<=0)return 0;
  const before=lifetimeDelivered, stepDt=2; let remaining=capped;
  while(remaining>0){ const d=Math.min(stepDt,remaining); sim(d); remaining-=d; }
  return lifetimeDelivered-before;
}
function fmtElapsed(sec){ const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  return h>0?`${h}h ${m}m`:`${m}m`; }
function loadGame(){
  let raw; try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
  if(!raw)return false;
  let data; try{ data=JSON.parse(raw); }catch(e){ return false; }
  if(!data||data.v!==4||!Array.isArray(data.nodes)||!Array.isArray(data.belts))return false; // older/unknown save format — fall through to a fresh reset()
  cell=Array.from({length:GH},()=>Array(GW).fill(null));
  deposits=(data.deposits||[]).map(d=>({x:d.x,y:d.y,good:d.good,rich:d.rich,discovered:!!d.discovered})); nodes={}; belts=[];
  nextId=data.nextId||1; battery=(data.battery!=null)?data.battery:CFG.batteryCap;
  techTier=data.techTier||0; tierProgress=data.tierProgress||{}; lifetimeDelivered=data.lifetimeDelivered||0;
  contracts=Array.isArray(data.contracts)?data.contracts:[]; credits=data.credits||0;
  contractsCompleted=data.contractsCompleted||0; prestigeCount=data.prestigeCount||0;
  crossings=(data.crossings&&typeof data.crossings==="object")?Object.assign({},data.crossings):{}; // added for Elevator Overpass — absent on older saves, defaults to no crossings (safe, no version bump needed)
  brownout=false;
  for(const d of deposits){ if(!cell[d.y] || !(d.x>=0&&d.x<GW))continue; cell[d.y][d.x]={t:"dep",d}; }
  for(const nd of data.nodes){
    if(nd.type==="generator"){ nodes[nd.id]={id:nd.id,type:"generator",x:nd.x,y:nd.y}; cell[nd.y][nd.x]={t:"bld",id:nd.id}; continue; }
    const b={id:nd.id,type:nd.type,x:nd.x,y:nd.y,recipeId:nd.recipeId||null,
      inBuf:nd.inBuf||{},outBuf:nd.outBuf||{},util:0,working:false,stalled:false};
    if(nd.type==="extractor"){ b.good=nd.good; b.tier=nd.tier||1;
      const dep=deposits.find(d=>d.x===nd.x&&d.y===nd.y);
      b.rate=dep?CFG.richness[dep.rich-1]*CFG.extractorMult[b.tier-1]*prestigeMult():0; }
    if(MIXNODE.has(nd.type)){ b.buf=nd.buf&&typeof nd.buf==="object"?nd.buf:{}; }
    nodes[nd.id]=b; cell[nd.y][nd.x]={t:"bld",id:nd.id};
  }
  for(const bd of data.belts){
    const be={id:bd.id,src:bd.src,dst:bd.dst,good:bd.good||null,filterGood:bd.filterGood,path:bd.path,cross:bd.cross||bd.path.map(()=>false),sprites:[],flow:0,mix:{},
      tier:bd.tier||1,cap:CFG.beltCap["t"+(bd.tier||1)]};
    belts.push(be);
    for(let i=0;i<be.path.length;i++){ if(!be.cross[i]){ const[x,y]=be.path[i]; cell[y][x]={t:"belt",id:be.id}; } }
  }
  let maxId=nextId; for(const id in nodes)maxId=Math.max(maxId,+id+1); for(const be of belts)maxId=Math.max(maxId,be.id+1);
  nextId=maxId;
  if(contracts.length<CONTRACT_SLOTS)fillContractSlots(); // defensive — normal play always keeps slots topped up, but don't leave a save stuck with an empty slot
  const elapsedSec=Math.max(0,((data.savedAt?Date.now()-data.savedAt:0))/1000);
  const gained=offlineCatchUp(elapsedSec);
  if(elapsedSec>5){ setHint(`Welcome back — ${Math.round(gained)} goods delivered while away (${fmtElapsed(elapsedSec)}).`,"ok"); }
  return true;
}

// ---------------------------------------------------------------- TEST API
window.__game={ reset, CFG, ITEMS, RECIPES, ELSE,
  place:(t,x,y,r,tier)=>{ const b=place(t,x,y,r,tier); return b?b.id:null; },
  // connect(src,dst,tier,explicitPath,forcedFilter,crossFlags) — forcedFilter is only consulted for a
  // Smart-Splitter SOURCE: a specific good id routes that good to this output, ELSE ("__else__") makes it a
  // catch-all for any good not claimed by another specific-good output on the same node.
  connect:(a,b,tier,explicitPath,forcedFilter,crossFlags)=>connect(a,b,tier,explicitPath,forcedFilter,crossFlags),
  tickN:(sec)=>{ const n=Math.round(sec/CFG.dt); for(let i=0;i<n;i++)tick(CFG.dt); },
  node:id=>nodes[id],
  deleteBuilding:(id)=>deleteBuilding(id),
  deleteBelt:(id)=>deleteBelt(id),
  changeRecipe:(id,recipeId)=>changeRecipe(id,recipeId),
  state:()=>({techTier,tierProgress:Object.assign({},tierProgress),tierNeed:currentTierNeed(),lifetimeDelivered,battery,brownout,
    contracts:contracts.map(c=>Object.assign({},c)),credits,contractsCompleted,prestigeCount,prestigeMult:prestigeMult(),
    crossingCount:Object.keys(crossings).length,
    nodes:Object.fromEntries(Object.entries(nodes).map(([k,b])=>[k,{type:b.type,util:b.util,stalled:b.stalled,inBuf:b.inBuf,outBuf:b.outBuf,buf:b.buf?Object.assign({},b.buf):undefined,rate:b.rate,tier:b.tier}])),
    belts:belts.map(be=>({src:be.src,dst:be.dst,good:be.good,filterGood:be.filterGood,mix:Object.assign({},be.mix),flow:be.flow,len:be.path.length,path:be.path,cross:be.cross,tier:be.tier,cap:be.cap}))}),
  tierUnlocked, TIERS, CONTRACT_POOL, CONTRACT_SLOTS,
  doPrestige:()=>doPrestige(), prestigeEligible, prestigeMult,
  crossings:()=>Object.assign({},crossings),
  deliverToTerminal:(termId,g,amt)=>{ const b=nodes[termId]; if(b)b.inBuf[g]=(b.inBuf[g]||0)+amt; },
  deposits:()=>deposits.map(d=>({x:d.x,y:d.y,good:d.good,rich:d.rich,discovered:!!d.discovered})),
  scanRegion, discoverAll:()=>{ for(const d of deposits)d.discovered=true; },
  findDeposit:(good)=>{ const d=deposits.find(d=>d.good===good&&cell[d.y][d.x].t==="dep"); return d?{x:d.x,y:d.y}:null; },
  saveGame, loadGame, clearSave,
  smartSplitterFilterCandidates:(id)=>{ const b=nodes[id]; return b?smartSplitterFilterCandidates(b):[]; },
  // driving the real pointer UI from tests, not just the data model:
  cellPx:(x,y)=>({x:cx(x),y:cy(y)}),
  uiState:()=>({mode,placeType,beltSrc,beltPath:beltPath.slice(),beltPathCross:beltPathCross.slice(),beltTier,scanning,scanStart,scanEnd}),
};

// ---------------------------------------------------------------- BOOT
if(!loadGame())reset();
buildPalette();
window.addEventListener("resize",()=>{resize();}); resize();
setInterval(saveGame,5000);
window.addEventListener("beforeunload",saveGame);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden")saveGame(); });
document.getElementById("newGameBtn").onclick=()=>{ if(confirm("Start a new game? This clears your save (including Credits and Prestige level).")){ clearSave(); reset(); buildPalette(); } };
document.getElementById("prestigeBtn").onclick=()=>{ if(!prestigeEligible())return;
  if(confirm(`Prestige? This clears your current factory (deposits, buildings, belts, tier progress) but keeps your Credits and permanently boosts every future extractor's rate by ${Math.round(PRESTIGE_MULT_PER_LEVEL*100)}%, stacking with any previous Prestige levels.`)){
    const res=doPrestige(); if(res.ok){ buildPalette(); setHint(`✨ Prestige! Extractor rate is now ×${res.mult.toFixed(2)}. Factory reset, Credits and Prestige level kept.`,"ok"); } } };
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
