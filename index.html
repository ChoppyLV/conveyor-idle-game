<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Line Balance — Act 1</title>
<style>
  :root{
    --bg:#12161c; --panel:#1b2129; --panel-border:#2a323d; --text:#e8ecf1;
    --dim:#8a94a3; --accent:#4fd1c5; --warn:#e07a3f; --ok:#4fd17a;
    --locked:#565f6c; --stall:#e0554f; --grid:#1d2430;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--panel-border);}
  header h1{font-size:15px;font-weight:600;margin:0;}
  header .tier{font-size:11px;color:var(--dim);}
  header .power{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;}
  #stage-wrap{position:relative;flex:1;overflow:hidden;background:#0d1015;}
  canvas{display:block;touch-action:none;width:100%;height:100%;}
  #analyze{position:absolute;top:8px;right:8px;width:230px;max-height:70%;overflow:auto;
    background:rgba(13,16,21,.95);border:1px solid var(--accent);border-radius:10px;
    padding:10px 12px;font-size:11px;line-height:1.45;display:none;}
  #analyze.show{display:block;}
  #analyze h3{margin:0 0 6px;font-size:11px;color:var(--accent);letter-spacing:.03em;}
  #analyze .r{display:flex;justify-content:space-between;gap:8px;padding:1px 0;}
  #analyze .r .k{color:var(--dim);}
  #analyze .b{color:var(--text);font-weight:600;margin-top:4px;}
  #analyze .sub{color:var(--dim);font-size:10px;}
  #hint{position:absolute;left:8px;bottom:8px;right:8px;font-size:12px;color:var(--dim);
    background:rgba(13,16,21,.8);border-radius:8px;padding:7px 10px;pointer-events:none;}
  #hint.ok{color:var(--ok);} #hint.warn{color:var(--warn);} #hint.stall{color:var(--stall);}
  footer{display:flex;gap:6px;padding:8px;border-top:1px solid var(--panel-border);overflow-x:auto;}
  .tool{flex:0 0 auto;background:var(--panel);color:var(--text);border:1px solid var(--panel-border);
    border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer;min-width:64px;text-align:center;}
  .tool.active{border-color:var(--accent);color:var(--accent);background:#16242a;}
  .tool small{display:block;font-weight:400;color:var(--dim);font-size:9.5px;margin-top:1px;}
  .tool:disabled{opacity:.4;cursor:not-allowed;}
  .modalOverlay{position:absolute;inset:0;background:rgba(8,10,14,.72);display:none;align-items:center;justify-content:center;z-index:5;}
  .modalOverlay.show{display:flex;}
  .modalOverlay .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;padding:14px;width:min(320px,90%);max-height:80%;overflow:auto;}
  .modalOverlay h4{margin:0 0 10px;font-size:13px;}
  .modalOverlay .opt{display:block;width:100%;text-align:left;background:#16242a;border:1px solid var(--panel-border);
    border-radius:8px;padding:9px 11px;margin-bottom:7px;color:var(--text);font-size:12px;cursor:pointer;}
  .modalOverlay .opt:hover{border-color:var(--accent);}
  .modalOverlay .opt .rt{color:var(--dim);font-size:10.5px;margin-top:2px;}
  .modalOverlay .cancel{color:var(--dim);font-size:11px;background:none;border:none;cursor:pointer;margin-top:2px;}
  .modalOverlay .infoRow{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:11.5px;}
  .modalOverlay .infoRow .k{color:var(--dim);}
  .modalOverlay .infoSec{margin-top:8px;font-size:10.5px;color:var(--accent);letter-spacing:.03em;}
  .modalOverlay .warnNote{color:var(--warn);font-size:10.5px;margin:4px 0 8px;}
  #tierPanel{position:absolute;top:8px;left:8px;width:210px;max-height:70%;overflow:auto;
    background:rgba(13,16,21,.95);border:1px solid var(--accent);border-radius:10px;
    padding:10px 12px;font-size:11px;line-height:1.45;display:none;}
  #tierPanel.show{display:block;}
  #tierPanel h3{margin:0 0 6px;font-size:11px;color:var(--accent);letter-spacing:.03em;}
  #tierPanel .r{display:flex;justify-content:space-between;gap:8px;padding:1px 0;}
  #tierPanel .r .k{color:var(--dim);}
  #tierPanel .b{color:var(--text);font-weight:600;margin-top:6px;}
  #tierPanel .sub{color:var(--dim);font-size:10px;margin-top:2px;}
  header .tier{cursor:pointer;text-decoration:underline dotted;}
  header .credits{font-size:12px;color:#e0c25c;font-variant-numeric:tabular-nums;margin-left:8px;}
  #contractsPanel{position:absolute;top:8px;right:8px;width:230px;max-height:70%;overflow:auto;
    background:rgba(13,16,21,.95);border:1px solid #e0c25c;border-radius:10px;
    padding:10px 12px;font-size:11px;line-height:1.45;display:none;}
  #contractsPanel.show{display:block;}
  #contractsPanel h3{margin:0 0 6px;font-size:11px;color:#e0c25c;letter-spacing:.03em;}
  #contractsPanel .b{color:var(--text);font-weight:600;margin-top:6px;}
  #contractsPanel .r{display:flex;justify-content:space-between;gap:8px;padding:1px 0;}
  #contractsPanel .r .k{color:var(--dim);}
  #contractsPanel .sub{color:var(--dim);font-size:10px;margin-top:2px;}
  #prestigeBtn{margin-left:6px;background:none;border:1px solid #8f7fe0;color:#8f7fe0;border-radius:6px;font-size:10px;padding:3px 7px;cursor:pointer;}
  #prestigeBtn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--panel-border);color:var(--dim);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Line Balance</h1><span class="tier" id="tierLbl" title="Tap for tier progress">Tier 0 · Boot</span>
    <span class="credits" id="creditsLbl" title="Credits — earned by completing Contracts">💰 0</span>
    <span class="power" id="powerLbl">⚡ 0</span>
    <button id="prestigeBtn" title="Reset the factory for a permanent production boost (unlocks once every tier is complete)" disabled>Prestige</button>
    <button id="newGameBtn" title="Start a new game (clears save)" style="margin-left:6px;background:none;border:1px solid var(--panel-border);color:var(--dim);border-radius:6px;font-size:10px;padding:3px 7px;cursor:pointer;">New</button>
  </header>
  <div id="stage-wrap">
    <canvas id="c"></canvas>
    <div id="analyze"><h3>ANALYZE</h3><div id="analyzeBody"></div></div>
    <div id="tierPanel"><h3>TIER PROGRESS</h3><div id="tierPanelBody"></div></div>
    <div id="contractsPanel"><h3>CONTRACTS</h3><div id="contractsPanelBody"></div></div>
    <div id="hint">Tap <b>Extractor</b>, then tap a faint ore deposit to place it. Then add a Smelting Furnace and Fabricator, and connect them with Belts.</div>
    <div id="recipePick" class="modalOverlay"><div class="card"><h4 id="rpTitle">Choose recipe</h4><div id="rpOpts"></div><button class="cancel" id="rpCancel">cancel</button></div></div>
    <div id="infoModal" class="modalOverlay"><div class="card"><h4 id="infoTitle">Building</h4><div id="infoBody"></div><div id="infoActions"></div><button class="cancel" id="infoCancel">close</button></div></div>
    <div id="goodPick" class="modalOverlay"><div class="card"><h4 id="gpTitle">Choose good to send</h4><div id="gpOpts"></div><button class="cancel" id="gpCancel">cancel</button></div></div>
  </div>
  <footer id="palette"></footer>
</div>
<script>
(function(){
"use strict";
// ---------------------------------------------------------------- CONFIG
const CFG = Object.assign({
  storageCap:200,       // buffer units per machine per good (scaled world)
  bigStorageCap:5000,   // Storage Room buffer cap — deliberately much larger than storageCap
  beltCap:{t1:3000,t2:6000},
  richness:[1000,3000,6000],
  extractorMult:[1,2,4],
  rateScale:100,        // reskinned data keeps Satisfactory RATIOS; ×100 → your 3000/min belt world
  batteryCap:600, genPerClick:60, autoPower:false,
  dt:1/20,              // sim seconds per fixed tick
  offlineCapSec:8*3600, // cap offline-earnings catch-up at 8h
}, window.__config||{});
const CAP=CFG.storageCap, BELT_T1=CFG.beltCap.t1, BIGCAP=CFG.bigStorageCap;

// ---------------------------------------------------------------- DATA (full MVP subset, 2026-07-22 eighth
// session — wired in from data/line_balance_game_data.json's 30 mvp:true items / 25 mvp&&!alternate recipes,
// which is exactly preproduction-plan.md §2's curated 25-craftable-material dry MVP subset (5 raw ores ->
// capstone Reinforced Frame, 6 producer buildings, 3 acts). Only the non-alternate MVP recipes are loaded —
// the other ~100 alternate recipes stay excluded, gated (per preproduction-plan.md §3) behind a future
// Salvage-Drive/R&D-Bench system that isn't built yet, same as before this session.
const ITEMS={
  ferrite_ore:{n:"Ferrite Ore",c:"#8a5a44"}, cuprite_ore:{n:"Cuprite Ore",c:"#b5734a"},
  chalkstone:{n:"Chalkstone",c:"#c9c4b0"}, cinder_coal:{n:"Cinder Coal",c:"#3a3a3f"},
  auralite_ore:{n:"Auralite Ore",c:"#d4b83a"},
  ferrite_ingot:{n:"Ferrite Ingot",c:"#c0c6cf"}, cuprite_ingot:{n:"Cuprite Ingot",c:"#e0864a"},
  auralite_ingot:{n:"Auralite Ingot",c:"#e8d05a"},
  ferrite_plate:{n:"Ferrite Plate",c:"#9aa4b2"}, ferrite_rod:{n:"Ferrite Rod",c:"#b8bec8"},
  bolts:{n:"Bolts",c:"#d0d6df"}, filament:{n:"Filament",c:"#e0a45c"},
  braided_cable:{n:"Braided Cable",c:"#c8a46a"}, castcrete:{n:"Castcrete",c:"#a8a89c"},
  cuprite_sheet:{n:"Cuprite Sheet",c:"#e8975e"},
  steel_billet:{n:"Steel Billet",c:"#6b7280"}, steel_girder:{n:"Steel Girder",c:"#565d68"},
  steel_tube:{n:"Steel Tube",c:"#7c8794"}, braced_plate:{n:"Braced Plate",c:"#8892a0"},
  turn_rotor:{n:"Turn Rotor",c:"#9aa0ac"}, field_stator:{n:"Field Stator",c:"#5c8fae"},
  drive_motor:{n:"Drive Motor",c:"#4a7a99"}, encased_girder:{n:"Encased Girder",c:"#4d5560"},
  rapidwire:{n:"Rapidwire",c:"#f0d878"}, logic_limiter:{n:"Logic Limiter",c:"#c9a83f"},
  em_control_rod:{n:"EM Control Rod",c:"#b58f2e"}, braced_frame:{n:"Braced Frame",c:"#3f4650"},
  smart_panel:{n:"Smart Panel",c:"#d4a83f"}, utility_frame:{n:"Utility Frame",c:"#333941"},
  reinforced_frame:{n:"Reinforced Frame",c:"#22262c"},
};
// recipe: building, in[], out[], sec  (rates scaled by rateScale). The original 8 keys below keep their old
// hand-authored ids (smelt_ferrite/fab_plate/etc, predating this session) rather than being renamed to match
// line_balance_game_data.json's flat recipe ids (ferrite_ingot/ferrite_plate/etc) — every regression test and
// every save ever written references these ids by name, and the ratios/buildings/rates are byte-identical to
// the JSON's own ferrite_ingot/cuprite_ingot/ferrite_plate/ferrite_rod/bolts/filament/braided_cable/castcrete
// entries either way, so renaming would only add risk for zero behavioral change. The 17 NEW recipes below use
// the JSON's own ids directly since nothing existing depends on a different name for them.
const RECIPES={
  smelt_ferrite:{name:"Ferrite Ingot",b:"smelter",in:[["ferrite_ore",1]],out:[["ferrite_ingot",1]],sec:2},
  smelt_cuprite:{name:"Cuprite Ingot",b:"smelter",in:[["cuprite_ore",1]],out:[["cuprite_ingot",1]],sec:2},
  fab_plate:{name:"Ferrite Plate",b:"fabricator",in:[["ferrite_ingot",3]],out:[["ferrite_plate",2]],sec:6},
  fab_rod:{name:"Ferrite Rod",b:"fabricator",in:[["ferrite_ingot",1]],out:[["ferrite_rod",1]],sec:4},
  fab_bolts:{name:"Bolts",b:"fabricator",in:[["ferrite_rod",1]],out:[["bolts",4]],sec:6},
  fab_filament:{name:"Filament",b:"fabricator",in:[["cuprite_ingot",1]],out:[["filament",2]],sec:4},
  fab_cable:{name:"Braided Cable",b:"fabricator",in:[["filament",2]],out:[["braided_cable",1]],sec:2},
  fab_castcrete:{name:"Castcrete",b:"fabricator",in:[["chalkstone",3]],out:[["castcrete",1]],sec:4},
  // --- new this session, from line_balance_game_data.json (mvp && !alternate), ids match the JSON exactly ---
  auralite_ingot:{name:"Auralite Ingot",b:"smelter",in:[["auralite_ore",3]],out:[["auralite_ingot",1]],sec:4},
  steel_billet:{name:"Steel Billet",b:"alloy_foundry",in:[["ferrite_ore",3],["cinder_coal",3]],out:[["steel_billet",3]],sec:4},
  cuprite_sheet:{name:"Cuprite Sheet",b:"fabricator",in:[["cuprite_ingot",2]],out:[["cuprite_sheet",1]],sec:6},
  rapidwire:{name:"Rapidwire",b:"fabricator",in:[["auralite_ingot",1]],out:[["rapidwire",5]],sec:5},
  steel_girder:{name:"Steel Girder",b:"fabricator",in:[["steel_billet",4]],out:[["steel_girder",1]],sec:4},
  steel_tube:{name:"Steel Tube",b:"fabricator",in:[["steel_billet",3]],out:[["steel_tube",2]],sec:6},
  braced_plate:{name:"Braced Plate",b:"assembly_station",in:[["ferrite_plate",6],["bolts",12]],out:[["braced_plate",1]],sec:12},
  turn_rotor:{name:"Turn Rotor",b:"assembly_station",in:[["ferrite_rod",5],["bolts",25]],out:[["turn_rotor",1]],sec:15},
  braced_frame:{name:"Braced Frame",b:"assembly_station",in:[["braced_plate",3],["ferrite_rod",12]],out:[["braced_frame",2]],sec:60},
  field_stator:{name:"Field Stator",b:"assembly_station",in:[["steel_tube",3],["filament",8]],out:[["field_stator",1]],sec:12},
  drive_motor:{name:"Drive Motor",b:"assembly_station",in:[["turn_rotor",2],["field_stator",2]],out:[["drive_motor",1]],sec:12},
  logic_limiter:{name:"Logic Limiter",b:"assembly_station",in:[["cuprite_sheet",5],["rapidwire",20]],out:[["logic_limiter",1]],sec:12},
  encased_girder:{name:"Encased Girder",b:"assembly_station",in:[["steel_girder",3],["castcrete",6]],out:[["encased_girder",1]],sec:10},
  em_control_rod:{name:"EM Control Rod",b:"assembly_station",in:[["field_stator",3],["logic_limiter",2]],out:[["em_control_rod",2]],sec:30},
  smart_panel:{name:"Smart Panel",b:"assembly_station",in:[["braced_plate",1],["turn_rotor",1]],out:[["smart_panel",1]],sec:30},
  utility_frame:{name:"Utility Frame",b:"assembly_station",in:[["braced_frame",1],["steel_girder",12]],out:[["utility_frame",2]],sec:24},
  reinforced_frame:{name:"Reinforced Frame",b:"manufactory",in:[["braced_frame",5],["steel_tube",20],["encased_girder",5],["bolts",120]],out:[["reinforced_frame",1]],sec:30},
};
const rpm=(qty,sec)=>qty*60/sec*CFG.rateScale;                 // units/min in scaled world
// PROC = every building type driven by a RECIPES entry (has a recipeId, inBuf/outBuf shaped by that recipe's
// in/out). Was hardcoded as "smelter or fabricator" before this session; now a real Set so the three new
// building types (Alloy Foundry, Assembly Station, Manufactory) plug into the exact same sim/UI code paths
// with zero duplicated logic — see makeNode()/sim()/changeRecipe()/nodeName()/buildingInfoRows() below.
const PROC=new Set(["smelter","fabricator","alloy_foundry","assembly_station","manufactory"]);
const POWER={extractor:100,smelter:140,fabricator:140,alloy_foundry:160,assembly_station:180,manufactory:260}; // kW while working (design values; new three are placeholders in the same spirit as the original two)

// Tech-tier turn-in schedule — placeholder, adapted from Satisfactory's real milestone tree (Tier 1
// "Logistics" unlocks Splitter+Merger together; "Field Research" unlocks the Object Scanner, same tier;
// Tier 2 "Logistics Mk.2" unlocks Belt Mk.2) mapped onto this game's own Act-1 materials/building set and
// compressed to 3 tiers. Pavel: swap these numbers out once real balancing starts — see mechanics-spec.md.
// Tier 1 is deliberately a SINGLE good, reachable from just the one starter deposit with a plain
// extractor->smelter->fabricator->terminal chain and no Splitter/Merger/2nd-ore-type needed — this mirrors
// real Satisfactory's own HUB Upgrade 1 (10x Iron Rod, one item, before copper is even reachable) and fixes
// a real softlock an earlier draft of this schedule had: it required Braided Cable (a copper/Cuprite-chain
// good) simultaneously with Tier 1, but Scanning (needed to ever find a Cuprite deposit) was ALSO gated
// behind Tier 1 — an unwinnable circular dependency. Scanning is now unlocked from the very start (matching
// Satisfactory's Resource Scanner, which is likewise available before any HUB Upgrade), and multi-good/
// multi-ore requirements only start at Tier 2, by which point Splitter/Merger (unlocked at Tier 1) make it
// practical to branch one smelter's output across two fabricators, and there's been time to scan for copper
// and limestone deposits.
const TIERS=[
  { name:"Flow",   need:[["ferrite_plate",30]],                                          unlocks:["splitter","merger"], unlockLabel:"Splitter, Merger" },
  { name:"Scale",  need:[["castcrete",20],["ferrite_rod",20],["braided_cable",20]],       unlocks:["belt2","storageroom","extractor2","alloy_foundry","assembly_station"], unlockLabel:"Belt T2, Storage Room, Extractor T2, Alloy Foundry, Assembly Station" },
  { name:"Frames", need:[["braided_cable",10],["bolts",10],["filament",10]],              unlocks:["extractor3","manufactory"], unlockLabel:"Extractor T3, Manufactory" },
];
// Alloy Foundry / Assembly Station land at Tier 2 ("Scale") and Manufactory at Tier 3 ("Frames") — this
// deliberately mirrors preproduction-plan.md §2's Act 2 (Alloy Foundry/Assembly Station, alongside Splitter)
// and Act 3 (Manufactory, alongside Merger/Belt T2/Storage Room/the Auralite branch) building unlocks, without
// reshaping the already-built/tested 3-tier turn-in schedule itself (same goods/quantities as before this
// session) — "Frames" was already this tier's name before Manufactory existed, and it's exactly where
// Manufactory's own capstone recipe (Reinforced Frame, built from Braced Frame) belongs thematically.
const TOOL_UNLOCK_TIER={splitter:1,merger:1,belt2:2,storageroom:2,smart_splitter:2,elevator:2,alloy_foundry:2,assembly_station:2,manufactory:3}; // scan is NOT here — always unlocked, see note above
const EXTRACTOR_TIER_UNLOCK={1:0,2:2,3:3}; // extractor tier -> techTier required
function tierUnlocked(tool){ const req=TOOL_UNLOCK_TIER[tool]; return req===undefined?true:techTier>=req; }
const ELSE="__else__"; // Smart Splitter catch-all output filter — see MULTI-GOOD BELTS section below
function currentTierNeed(){ return techTier<TIERS.length?TIERS[techTier].need:[]; }
function terminalAcceptGoods(){ return [...new Set([...currentTierNeed().map(x=>x[0]), ...contracts.map(c=>c.good)])]; }
function advanceTier(){ const done=TIERS[techTier]; techTier++; tierProgress={};
  for(const id in nodes){ const b=nodes[id]; if(b.type==="terminal"){ const keep={}; for(const g of terminalAcceptGoods())keep[g]=b.inBuf[g]||0; b.inBuf=keep; } }
  buildPalette();
  setHint(`✅ Tier ${techTier} complete — ${done.unlockLabel} unlocked!`,"ok"); }

// ---------------------------------------------------------------- CONTRACTS + PRESTIGE (2026-07-21, fourth session)
// Contracts are hand-authored side quotas for goods the player is already producing (per preproduction-plan.md
// §3's "5-8 hand-authored contracts" + Salvage-Drive-adjacent reward idea, scoped down since Dispatch Dock/R&D
// Bench aren't built yet). Deliberately reuse the Assembly Terminal instead of a new building: once a good's
// CURRENT-TIER quota is met, any further delivery of that good used to just sit unconsumed in the terminal's
// buffer (see the tier-delivery comment in sim() below) — contracts now claim exactly that leftover surplus,
// which ties neatly into the game's own "surplus isn't wasted" theme instead of adding a whole new sink building.
const CONTRACT_POOL=[ // id, good, qty, reward (Credits) — placeholder numbers, Pavel's to rebalance like everything else
  {id:"c1",good:"ferrite_plate",qty:40,reward:20},
  {id:"c2",good:"ferrite_rod",qty:30,reward:18},
  {id:"c3",good:"bolts",qty:60,reward:22},
  {id:"c4",good:"braided_cable",qty:25,reward:24},
  {id:"c5",good:"castcrete",qty:35,reward:20},
  {id:"c6",good:"filament",qty:30,reward:20},
  {id:"c7",good:"cuprite_ingot",qty:50,reward:16},
  {id:"c8",good:"ferrite_ingot",qty:60,reward:16},
];
const CONTRACT_SLOTS=2;
function fillContractSlots(){
  while(contracts.length<CONTRACT_SLOTS){
    const activeIds=new Set(contracts.map(c=>c.poolId));
    const candidate=CONTRACT_POOL.find(p=>!activeIds.has(p.id));
    if(!candidate)break; // every pool entry is already active (rare with 8 entries / 2 slots) — just run with fewer slots filled
    contracts.push({poolId:candidate.id,good:candidate.good,qty:candidate.qty,reward:candidate.reward,progress:0});
    for(const id in nodes){ const b=nodes[id]; if(b.type==="terminal"&&!(candidate.good in b.inBuf))b.inBuf[candidate.good]=0; }
  }
}
// Prestige: full factory reset in exchange for a small permanent production multiplier, applied once at each
// extractor's placement (baked into b.rate, same as richness/tier already are — no per-tick lookup needed).
// Unlock condition is a PLACEHOLDER: gated on clearing every currently-built tier (there's no capstone item yet
// to gate it on properly, unlike the "ship a showpiece part, then Prestige" endgame preproduction-plan.md
// describes) — move this once a real capstone tier exists. Credits and prestige count persist across a
// Prestige reset (that's the whole point); a "New Game" (clearing the save entirely) wipes those too.
const PRESTIGE_MULT_PER_LEVEL=0.10; // +10% extractor rate per prestige level — placeholder, tunable
function prestigeMult(){ return 1+PRESTIGE_MULT_PER_LEVEL*prestigeCount; }
function prestigeEligible(){ return techTier>=TIERS.length; }
function wipeFactory(){
  cell=Array.from({length:GH},()=>Array(GW).fill(null));
  deposits=[]; nodes={}; belts=[]; nextId=1; crossings={};
  battery=CFG.batteryCap; techTier=0; tierProgress={}; lifetimeDelivered=0; brownout=false;
  contracts=[];
  seedDeposits();
  fillContractSlots();
}
function doPrestige(){
  if(!prestigeEligible())return{err:"Complete every tier first, then Prestige unlocks."};
  prestigeCount++;
  wipeFactory();
  return{ok:true,prestigeCount,mult:prestigeMult()};
}

const BUILD={
  extractor:{label:"Extractor",sub:"on deposit",color:"#d9a441"},
  smelter:{label:"Smelt. Furnace",sub:"1→1 ingot",color:"#e0864a"},
  fabricator:{label:"Fabricator",sub:"1 part",color:"#4fd1c5"},
  alloy_foundry:{label:"Alloy Foundry",sub:"2→1 alloy",color:"#8a6a4a"},
  assembly_station:{label:"Assembly Station",sub:"2-in part",color:"#5f8fc4"},
  manufactory:{label:"Manufactory",sub:"deep combine",color:"#2f3540"},
  splitter:{label:"Splitter",sub:"1→3 proportional",color:"#8f7fe0"},
  merger:{label:"Merger",sub:"3→1 combine all",color:"#4fb3e0"},
  smart_splitter:{label:"Smart Splitter",sub:"filter goods 1↔3",color:"#e07a9e"},
  storageroom:{label:"Storage Room",sub:"buffer",color:"#7a8a99"},
  terminal:{label:"Assembly Terminal",sub:"deliver",color:"#4fd17a"},
  generator:{label:"Generator",sub:"tap: +"+CFG.genPerClick+"kW",color:"#c8b04a"},
};

// ---------------------------------------------------------------- GRID / WORLD
const GW=16, GH=11;            // grid cells
let cell, deposits, nodes, belts, nextId, battery, techTier, tierProgress, lifetimeDelivered, brownout;
let contracts, credits, contractsCompleted, prestigeCount;
let crossings; // Elevator Overpass — {"[y*GW+x]": beltId} for cells where a belt crosses over another belt's cell, mechanics-spec.md §1.4
function reset(){ // full wipe, incl. Credits/prestige — this is the "New Game" reset, distinct from Prestige (see wipeFactory/doPrestige below)
  credits=0; contractsCompleted=0; prestigeCount=0;
  wipeFactory();
}
function seedDeposits(){
  // cinder_coal/auralite_ore deposits added 2026-07-22 (eighth session, recipe-tree wiring) — placed in far
  // corners deliberately clear of every existing deposit/test-scenario cluster above, so no prior regression
  // test's hardcoded coordinates collide with them.
  const seed=[[2,3,"ferrite_ore",1],[3,7,"ferrite_ore",2],[6,2,"cuprite_ore",1],
              [11,8,"ferrite_ore",2],[13,4,"cuprite_ore",1],[8,9,"chalkstone",1],
              [15,0,"cinder_coal",2],[0,10,"auralite_ore",1]];
  seed.forEach(([x,y,g,r],i)=>{ const d={x,y,good:g,rich:r,discovered:i===0}; deposits.push(d); cell[y][x]={t:"dep",d}; }); // only the first deposit starts known — the rest need Scanning
}
function revealDeposit(d){ d.discovered=true; }
function scanRegion(x1,y1,x2,y2){ const lo_x=Math.min(x1,x2),hi_x=Math.max(x1,x2),lo_y=Math.min(y1,y2),hi_y=Math.max(y1,y2);
  let n=0; for(const d of deposits){ if(!d.discovered && d.x>=lo_x&&d.x<=hi_x&&d.y>=lo_y&&d.y<=hi_y){ revealDeposit(d); n++; } } return n; }
// ---------------------------------------------------------------- NODES
const MIXNODE=new Set(["splitter","merger","storageroom","smart_splitter"]); // multi-good pass-through/combine/filter nodes
function makeNode(type,x,y,recipeId,tier){
  const id=nextId++, b={id,type,x,y,recipeId:recipeId||null,
    inBuf:{},outBuf:{},util:0,working:false,stalled:false};
  if(type==="extractor"){ const d=cell[y][x].d; b.good=d.good; b.tier=tier||1;
    b.rate=CFG.richness[d.rich-1]*CFG.extractorMult[b.tier-1]*prestigeMult(); b.outBuf[d.good]=0; }
  if(PROC.has(type)){ const r=RECIPES[recipeId];
    r.in.forEach(([g])=>b.inBuf[g]=0); r.out.forEach(([g])=>b.outBuf[g]=0); }
  if(MIXNODE.has(type)){ b.buf={}; } // per-good buckets — every mix node (Splitter/Merger/Storage Room/Smart Splitter)
    // carries an arbitrary blend of goods now (mechanics-spec.md §1.3 rewrite, 2026-07-22): belts themselves are
    // unlimited in *variety*, capped only in total throughput by their tier, so there's no more single ".good".
  if(type==="terminal"){ for(const g of terminalAcceptGoods())b.inBuf[g]=0; }
  nodes[id]=b; cell[y][x]={t:"bld",id}; return b;
}
// ports: how many belts a node has (no longer keyed by good — a single belt can carry many goods at once,
// so "one port per good" only still applies to strictly single-good machines; mix nodes just cap belt COUNT).
function outBeltCount(b){ return belts.filter(be=>be.src===b.id).length; }
function inBeltCount(b){ return belts.filter(be=>be.dst===b.id).length; }
function smartSplitterOutFilters(s){ return belts.filter(be=>be.src===s.id).map(be=>be.filterGood); }
function smartSplitterFilterCandidates(s){ const claimed=new Set(smartSplitterOutFilters(s).filter(f=>f&&f!==ELSE));
  return [...Object.keys(ITEMS).filter(g=>!claimed.has(g)), ELSE]; } // ELSE is always offered — any number of "everything else" outputs is fine
function bufTotal(b){ let t=0; for(const g in(b.buf||{}))t+=b.buf[g]; return t; }
function bufSummary(b){ const goods=Object.keys(b.buf||{}).filter(g=>b.buf[g]>1e-6); return goods.length?goods.map(g=>ITEMS[g].n+" "+Math.round(b.buf[g])).join(", "):"empty"; }

// ---------------------------------------------------------------- SIM
// A node's currently-available supply, as a live per-good {good:amount} reference (mutating it IS the real
// decrement — machines still produce exactly one good per output in this MVP recipe set, but mix nodes hold
// an arbitrary blend, hence the split here).
function sourceAvail(s){ return MIXNODE.has(s.type) ? (s.buf=s.buf||{}) : s.outBuf; }
// Note: this never deletes the key once it drops to ~0 — sourceAvail() can point at a MIXNODE's dynamic `buf`
// (fine either way) OR at an extractor/smelter/fabricator's fixed-shape `outBuf` (makeNode() always initializes
// every recipe-output good's key to 0 and every piece of downstream math assumes that key keeps existing).
// Deleting it here left a later sim() tick doing `CAP - undefined` -> NaN, which then poisoned that good's
// production forever (a real regression this rewrite introduced — caught by the regression suite, not a
// hypothetical). Clamping to 0 instead of deleting keeps both node shapes correct.
function subtractFrom(s,g,amt){ const buf=sourceAvail(s); buf[g]=Math.max(0,(buf[g]||0)-amt); }
// 0 if the destination flatly can't use a good at all (wrong recipe input, wrong terminal need, extractor/generator);
// otherwise its remaining buffer room for that good.
function destRoom(d,g){
  if(d.type==="terminal")return terminalAcceptGoods().includes(g)?1e9:0;
  if(MIXNODE.has(d.type)){ const cap=d.type==="storageroom"?BIGCAP:CAP; return cap-(((d.buf=d.buf||{})[g])||0); }
  if(d.type==="extractor"||d.type==="generator")return 0;
  const ing=RECIPES[d.recipeId].in.map(x=>x[0]); if(!ing.includes(g))return 0;
  return CAP-(d.inBuf[g]||0);
}
function addIn(d,g,amt){ if(amt<=0)return; if(MIXNODE.has(d.type)){ d.buf=d.buf||{}; d.buf[g]=(d.buf[g]||0)+amt; }
  else d.inBuf[g]=(d.inBuf[g]||0)+amt; }

// Push a shared multi-good `supply` (mutated in place — pass a node's REAL outBuf/buf, not a copy) out across
// one or more (belt,dst[,filter]) branches. filter=undefined → every branch is eligible for every good (plain
// regular belt, or a blind Splitter that doesn't care what's riding the belt). filter="__else__" (ELSE) → only
// takes goods no OTHER branch in this same call has claimed with a specific-good filter (Smart Splitter's
// catch-all output). filter=<good> → only that exact good may use this branch (Smart Splitter's routed output).
// Each branch's own belt-tier cap is shared across every good that ends up riding it this tick (goods are
// processed richest-first, depleting each branch's remaining per-tick capacity as they go).
function distribute(supply,branches,dt){
  const remainingCap={}; for(const br of branches)remainingCap[br.belt.id]=br.belt.cap*dt/60;
  const claimed=new Set(branches.filter(br=>br.filter&&br.filter!==ELSE).map(br=>br.filter));
  const goods=Object.keys(supply).filter(g=>supply[g]>1e-9).sort((a,b)=>supply[b]-supply[a]);
  const moved={}; for(const br of branches)moved[br.belt.id]={};
  for(const g of goods){
    const eligible=branches.filter(br=>br.filter===undefined?true:br.filter===ELSE?!claimed.has(g):br.filter===g);
    if(!eligible.length)continue; // nothing here wants/can carry this good — it stays put (visible backpressure)
    const rooms=eligible.map(br=>Math.max(0,Math.min(remainingCap[br.belt.id],destRoom(br.dst,g))));
    const totalRoom=rooms.reduce((a,x)=>a+x,0);
    const moveTotal=Math.min(supply[g],totalRoom); if(moveTotal<=1e-9)continue;
    for(let i=0;i<eligible.length;i++){ const share=totalRoom>0?moveTotal*rooms[i]/totalRoom:0; if(share<=1e-9)continue;
      addIn(eligible[i].dst,g,share); remainingCap[eligible[i].belt.id]-=share;
      moved[eligible[i].belt.id][g]=(moved[eligible[i].belt.id][g]||0)+share; supply[g]-=share; }
    // Clamp instead of delete: `supply` is often a node's REAL outBuf/buf (see comment above), and for a
    // single-good extractor/smelter/fabricator outBuf, deleting the key here leaves it `undefined` on the next
    // sim() tick, where `CAP-b.outBuf[b.good]` silently becomes NaN and poisons that good's production forever
    // (a real regression this rewrite introduced, caught by the regression suite). Safe for MIXNODE bufs too —
    // every reader already treats near-zero/absent the same way (`||0`, `>1e-6`/`>1e-9` filters).
    if(supply[g]<1e-9)supply[g]=0;
  }
  return moved;
}
// Pull from up to 3 (belt,src) branches into one shared destination, weighted per-good by each source's
// available supply (mirrors distribute() — the Merger/Smart-Splitter-input symmetric dual of a Splitter).
function collect(branches,dst,dt){
  const remainingCap={}; for(const br of branches)remainingCap[br.belt.id]=br.belt.cap*dt/60;
  const goodsSet=new Set(); for(const br of branches){ const av=sourceAvail(br.src); for(const g in av)if(av[g]>1e-9)goodsSet.add(g); }
  const moved={}; for(const br of branches)moved[br.belt.id]={};
  for(const g of goodsSet){
    const avails=branches.map(br=>Math.max(0,Math.min(remainingCap[br.belt.id],(sourceAvail(br.src)[g]||0))));
    const totalAvail=avails.reduce((a,x)=>a+x,0);
    const room=destRoom(dst,g); const pullTotal=Math.min(totalAvail,room); if(pullTotal<=1e-9)continue;
    for(let i=0;i<branches.length;i++){ const share=totalAvail>0?pullTotal*avails[i]/totalAvail:0; if(share<=1e-9)continue;
      subtractFrom(branches[i].src,g,share); remainingCap[branches[i].belt.id]-=share;
      moved[branches[i].belt.id][g]=(moved[branches[i].belt.id][g]||0)+share; }
    addIn(dst,g,pullTotal);
  }
  return moved;
}
function sim(dt){
  // 1. extractors + machines
  let demand=0;
  for(const id in nodes){ const b=nodes[id];
    if(b.type==="extractor"){
      const cap=Math.min(b.rate, BELT_T1*99); // extractor throttled later by belt/backpressure via outBuf room
      const room=CAP-b.outBuf[b.good];
      const add=Math.min(cap*dt/60, room);
      const p=powerScale(POWER.extractor,dt,demand);
      const got=add*p.f; b.outBuf[b.good]+=got; b.working=got>1e-9; b.util=cap>0?(got/(cap*dt/60)):0;
      b.stalled=room<=1e-6; demand=p.d;
    } else if(PROC.has(b.type)){
      const r=RECIPES[b.recipeId]; const potCycles=(60/r.sec)*CFG.rateScale*dt/60; // cycles this tick at 100%
      let lim=potCycles;
      r.in.forEach(([g,q])=>lim=Math.min(lim,(b.inBuf[g]||0)/q));
      r.out.forEach(([g,q])=>lim=Math.min(lim,(CAP-(b.outBuf[g]||0))/q));
      const p=powerScale(POWER[b.type],dt,demand); lim*=p.f; demand=p.d;
      if(lim<0)lim=0;
      r.in.forEach(([g,q])=>b.inBuf[g]-=lim*q);
      r.out.forEach(([g,q])=>b.outBuf[g]+=lim*q);
      b.util=potCycles>0?lim/potCycles:0; b.working=lim>1e-9; b.stalled=(potCycles>lim+1e-6)&&anyInput(b,r);
    }
  }
  // 2. belts transfer — every belt now potentially carries several goods at once (mechanics-spec.md §1.3
  // rewrite). Each belt is processed EXACTLY ONCE, by whichever of the three passes below applies to it:
  //   (a) fan-IN — belts feeding a Merger or Smart Splitter (many sources -> one shared buffer, supply-weighted)
  //   (b) fan-OUT — remaining belts leaving a Splitter or Smart Splitter (one shared buffer -> up to 3 branches,
  //       room-weighted, filtered for Smart Splitter)
  //   (c) everything else — a plain 1:1 belt, handled as a one-branch distribute() (identical math, just N=1)
  const done=new Set();
  const fanIn={};
  for(const be of belts){ const d=nodes[be.dst]; if(d.type==="merger"||d.type==="smart_splitter")(fanIn[be.dst]=fanIn[be.dst]||[]).push(be); }
  for(const dstId in fanIn){ const dst=nodes[dstId]; const bl=fanIn[dstId];
    const branches=bl.map(be=>({belt:be,src:nodes[be.src]}));
    const moved=collect(branches,dst,dt);
    for(const be of bl){ flow(be,moved[be.id]||{},dt); done.add(be.id); }
  }
  const fanOut={};
  for(const be of belts){ if(done.has(be.id))continue; const s=nodes[be.src]; if(s.type==="splitter"||s.type==="smart_splitter")(fanOut[be.src]=fanOut[be.src]||[]).push(be); }
  for(const srcId in fanOut){ const s=nodes[srcId]; const bl=fanOut[srcId];
    const branches=bl.map(be=>({belt:be,dst:nodes[be.dst],filter:be.filterGood}));
    const moved=distribute(sourceAvail(s),branches,dt);
    for(const be of bl){ flow(be,moved[be.id]||{},dt); done.add(be.id); }
  }
  for(const be of belts){ if(done.has(be.id))continue; const s=nodes[be.src], d=nodes[be.dst];
    const moved=distribute(sourceAvail(s),[{belt:be,dst:d}],dt);
    flow(be,moved[be.id]||{},dt); done.add(be.id);
  }
  // 3. terminal delivery — multi-good turn-in toward the current tier's requirement
  const need=currentTierNeed();
  for(const id in nodes){ const b=nodes[id]; if(b.type==="terminal"){
    for(const[g,q]of need){ if(b.inBuf[g]>0){ const room=Math.max(0,q-(tierProgress[g]||0)); const take=Math.min(b.inBuf[g],room);
      if(take>0){ tierProgress[g]=(tierProgress[g]||0)+take; lifetimeDelivered+=take; }
      b.inBuf[g]-=take; /* anything beyond what the tier still needs falls through to contracts, below */ } }
    // contracts: whatever's left of a good AFTER the tier's own need is satisfied claims against active contracts —
    // this is deliberately the same "surplus" that used to just sit unconsumed in the buffer (see comment above)
    for(const c of contracts){ if(b.inBuf[c.good]>0){ const room=Math.max(0,c.qty-c.progress); const take=Math.min(b.inBuf[c.good],room);
      if(take>0){ c.progress+=take; lifetimeDelivered+=take; }
      b.inBuf[c.good]-=take; } }
  } }
  if(techTier<TIERS.length&&need.every(([g,q])=>(tierProgress[g]||0)>=q))advanceTier();
  for(let i=contracts.length-1;i>=0;i--){ const c=contracts[i]; if(c.progress>=c.qty){ credits+=c.reward; contractsCompleted++; contracts.splice(i,1); } }
  if(contracts.length<CONTRACT_SLOTS)fillContractSlots();
  // 4. sprites advance
  for(const be of belts) advSprites(be,dt);
}
function anyInput(b,r){ return r.in.every(([g,q])=>(b.inBuf[g]||0)>=q-1e-9); }
function powerScale(kw,dt,demand){ if(CFG.autoPower)return{f:1,d:demand};
  const need=kw*dt/60; if(battery>=demand+need)return{f:1,d:demand+need};
  const avail=Math.max(0,battery-demand); const f=need>0?Math.min(1,avail/need):1; return{f,d:demand+need*f}; }

// ---------------------------------------------------------------- BELT SPRITES (hybrid visual only)
function flow(be,movedByGood,dt){ let total=0; for(const g in movedByGood)total+=movedByGood[g];
  be.flow=total*60/dt/CFG.rateScale; be.mix=movedByGood; be._acc=(be._acc||0)+(total/CFG.rateScale)*12; // spawn density
  while(be._acc>=1){ be._acc-=1; be.sprites.push({p:0,g:pickWeightedGood(movedByGood)}); } }
function pickWeightedGood(mix){ const goods=Object.keys(mix).filter(g=>mix[g]>1e-9); if(!goods.length)return null;
  if(goods.length===1)return goods[0];
  const total=goods.reduce((a,g)=>a+mix[g],0); let r=Math.random()*total;
  for(const g of goods){ r-=mix[g]; if(r<=0)return g; } return goods[goods.length-1]; }
function advSprites(be,dt){ const spd=0.45*dt*CFG.rateScale/50*20; // visual speed
  for(const s of be.sprites)s.p+=spd; be.sprites=be.sprites.filter(s=>s.p<1&&s.g); if(be.sprites.length>60)be.sprites.length=60; }

// ---------------------------------------------------------------- BELT ROUTING (strict ports + no-cross)
function neighbors(x,y){ return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&a<GW&&b>=0&&b<GH); }
function passable(x,y){ const c=cell[y][x]; return !c || c.t==="belt"?false:false; } // belts block (no-cross)
function isEmpty(x,y){ return !cell[y][x]; }
function routeBetween(a,b){ // BFS through empty cells from a neighbor of a to a neighbor of b
  const starts=neighbors(a.x,a.y).filter(([x,y])=>isEmpty(x,y));
  const goalCells=new Set(neighbors(b.x,b.y).filter(([x,y])=>isEmpty(x,y)).map(([x,y])=>y*GW+x));
  if(!starts.length||!goalCells.size)return null;
  const q=[], prev={}, seen=new Set();
  for(const[x,y]of starts){ const k=y*GW+x; q.push([x,y]); seen.add(k); prev[k]=null; }
  while(q.length){ const[x,y]=q.shift(); const k=y*GW+x;
    if(goalCells.has(k)){ const path=[]; let cur=k; while(cur!=null){ path.unshift([cur%GW,(cur-cur%GW)/GW]); cur=prev[cur]; } return path; }
    for(const[nx,ny]of neighbors(x,y)){ const nk=ny*GW+nx; if(seen.has(nk)||!isEmpty(nx,ny))continue; seen.add(nk); prev[nk]=k; q.push([nx,ny]); } }
  return null;
}
function adj(x1,y1,x2,y2){ return Math.abs(x1-x2)+Math.abs(y1-y2)===1; }
function validExplicitPath(s,d,path,crossFlags){ // player-drawn path: every cell empty (or, if flagged, a valid Elevator Overpass crossing over an existing belt), step-by-step adjacent from s to d
  if(path.length===0)return adj(s.x,s.y,d.x,d.y);
  if(!adj(s.x,s.y,path[0][0],path[0][1]))return false;
  for(let i=1;i<path.length;i++){ if(!adj(path[i-1][0],path[i-1][1],path[i][0],path[i][1]))return false; }
  const last=path[path.length-1]; if(!adj(last[0],last[1],d.x,d.y))return false;
  for(let i=0;i<path.length;i++){ const[x,y]=path[i];
    if(crossFlags&&crossFlags[i]){ const c=cell[y][x]; if(!c||c.t!=="belt")return false; if(crossings[y*GW+x])return false; }
    else{ if(!isEmpty(x,y))return false; }
  }
  return true;
}
// connect(): srcId/dstId, tier (1|2), explicitPath, forcedFilter (Smart Splitter only — a specific good id
// or ELSE), crossFlags. `good`, where knowable below, is only used for player-facing messaging and for the
// strict single-good ports that still exist on extractor/smelter/fabricator/terminal-hint — a belt leaving a
// Splitter/Merger/Storage Room, or a Smart Splitter's ELSE output, is a MIX and simply isn't known in advance.
function connect(srcId,dstId,tier,explicitPath,forcedFilter,crossFlags){ const s=nodes[srcId], d=nodes[dstId]; if(!s||!d)return{err:"missing"}; tier=(tier===2)?2:1;
  let good=null, filter; // good: a definite single good if this belt's content is knowable now; filter: Smart Splitter's chosen output routing rule
  if(s.type==="smart_splitter"){
    if(outBeltCount(s)>=3)return{err:"Smart Splitter already has 3 outputs"};
    if(forcedFilter){
      if(forcedFilter!==ELSE&&smartSplitterOutFilters(s).includes(forcedFilter))return{err:"That good is already routed to another output"};
      filter=forcedFilter; good=(filter!==ELSE)?filter:null;
    } else return{err:"AMBIGUOUS_GOOD",candidates:smartSplitterFilterCandidates(s)};
  }
  else if(s.type==="splitter"){ if(outBeltCount(s)>=3)return{err:"Splitter already has 3 outputs"}; } // a blind proportional fan-out — content is a mix, not knowable in advance
  else if(s.type==="merger"||s.type==="storageroom"){ if(outBeltCount(s)>=1)return{err:(s.type==="merger"?"Merger":"Storage Room")+" already has an output"}; }
  else if(s.type==="extractor"){ if(outBeltCount(s)>=1)return{err:"Extractor output already used"}; good=s.good; }
  else if(s.type==="terminal"||s.type==="generator"){ return{err:"Nothing to connect from here"}; }
  else { // smelter/fabricator: pick an output good not already claimed by an existing belt
    const used=new Set(belts.filter(be=>be.src===s.id).map(be=>be.good));
    good=RECIPES[s.recipeId].out.map(x=>x[0]).find(g=>!used.has(g));
    if(!good)return{err:"No free output port"};
  }
  // dest accept — mix nodes (Splitter/Merger/Storage Room/Smart Splitter) accept ANY good now, only belt-count caps apply
  if(d.type==="terminal"){
    if(good&&!terminalAcceptGoods().includes(good))return{err:(techTier>=TIERS.length&&contracts.length===0)?"Terminal has nothing to deliver right now":"Terminal doesn't need "+ITEMS[good].n+" right now (not this tier, and no active contract wants it)"};
    // no port cap — the terminal has "1+" input ports per mechanics-spec.md and now happily takes any number of belts, mixed or not
  }
  else if(d.type==="splitter"){ if(inBeltCount(d)>=1)return{err:"Splitter input already used"}; }
  else if(d.type==="merger"){ if(inBeltCount(d)>=3)return{err:"Merger already has 3 inputs"}; }
  else if(d.type==="smart_splitter"){ if(inBeltCount(d)>=3)return{err:"Smart Splitter already has 3 inputs"}; }
  else if(d.type==="storageroom"){ if(inBeltCount(d)>=1)return{err:"Storage Room input already used"}; }
  else if(d.type==="extractor"||d.type==="generator"){ return{err:"Can't feed that"}; }
  else { const ing=RECIPES[d.recipeId].in.map(x=>x[0]);
    if(inBeltCount(d)>=ing.length)return{err:"All input ports are already used"};
    if(good&&!ing.includes(good))return{err:ITEMS[good].n+" isn't an input here"}; // a mix-sourced belt (unknown content) is allowed through — it just won't deliver anything the machine doesn't want
  }
  let path;
  if(explicitPath){ if(!validExplicitPath(s,d,explicitPath,crossFlags))return{err:"That belt path isn't valid anymore — try drawing it again"}; path=explicitPath; }
  else { path=routeBetween(s,d); if(!path)return{err:"No clear belt path — route around, or move a machine"}; }
  const cross=crossFlags?crossFlags.slice():path.map(()=>false);
  const be={id:nextId++,src:srcId,dst:dstId,good,filterGood:filter,path,cross,sprites:[],flow:0,mix:{},tier,cap:CFG.beltCap["t"+tier]};
  for(let i=0;i<path.length;i++){ const[x,y]=path[i];
    if(cross[i]){ crossings[y*GW+x]=be.id; } else { cell[y][x]={t:"belt",id:be.id}; } } // Elevator Overpass: a crossing cell keeps the belt underneath as ground-owner; this belt just registers as passing over it
  belts.push(be);
  return{ok:be};
}

// ---------------------------------------------------------------- PLACEMENT
function canPlace(type,x,y){ const c=cell[y][x];
  if(type==="extractor")return c&&c.t==="dep"&&c.d.discovered;
  if(type==="splitter"||type==="merger"||type==="smart_splitter")return !c||(c.t==="belt"&&!crossings[y*GW+x]); // these may also be spliced onto an existing belt, but not where an Elevator Overpass crosses it
  return !c; }
function spliceOnBelt(type,x,y){ // insert a Splitter/Merger/Smart Splitter into the middle of an existing belt, splitting it in two
  const c=cell[y][x]; if(!c||c.t!=="belt")return null;
  if(crossings[y*GW+x])return null; // an overpass crosses this cell — can't splice a building in mid-air
  const be=belts.find(b=>b.id===c.id); if(!be)return null;
  const idx=be.path.findIndex(([px,py])=>px===x&&py===y); if(idx<0)return null;
  const beCross=be.cross||be.path.map(()=>false);
  if(beCross[idx])return null; // this cell is itself an elevated segment of `be` — can't splice mid-air
  const origDstId=be.dst, good=be.good, tier=be.tier, cap=be.cap;
  const beforePath=be.path.slice(0,idx), beforeCross=beCross.slice(0,idx);
  const afterPath=be.path.slice(idx+1), afterCross=beCross.slice(idx+1);
  for(let i=0;i<be.path.length;i++){ if(!beCross[i]){ const[px,py]=be.path[i]; cell[py][px]=null; } } // clear only the cells `be` actually claimed as ground — crossing cells belong to a different belt's ground and are left untouched
  const node=makeNode(type,x,y);
  // before-segment reuses the original belt's id/src, now ending at the new node
  be.dst=node.id; be.path=beforePath; be.cross=beforeCross; be.sprites=[];
  for(let i=0;i<beforePath.length;i++){ if(!beforeCross[i]){ const[px,py]=beforePath[i]; cell[py][px]={t:"belt",id:be.id}; } }
  // after-segment is a fresh belt from the new node to the original destination. If the new node is a Smart
  // Splitter, its one auto-created output defaults to ELSE (catch-everything) since there's no interactive
  // picker in this non-interactive splice path — the player can wire additional filtered outputs afterward.
  const afterFilter=(node.type==="smart_splitter")?ELSE:undefined;
  const afterBelt={id:nextId++,src:node.id,dst:origDstId,good:(node.type==="smart_splitter")?null:good,filterGood:afterFilter,path:afterPath,cross:afterCross,sprites:[],flow:0,mix:{},tier,cap};
  belts.push(afterBelt);
  for(let i=0;i<afterPath.length;i++){ if(!afterCross[i]){ const[px,py]=afterPath[i]; cell[py][px]={t:"belt",id:afterBelt.id}; } }
  // Port counts (inBeltCount/outBeltCount) are derived live from the belts array, so the spliced node
  // automatically shows up with 1 input + 1 output already used, same as if it had been built that way.
  return node;
}
function place(type,x,y,recipeId,tier){ if(!canPlace(type,x,y))return null;
  if(type==="extractor")return makeNode("extractor",x,y,null,tier);
  if(type==="generator"){ const b={id:nextId++,type:"generator",x,y}; nodes[b.id]=b; cell[y][x]={t:"bld",id:b.id}; return b; }
  if((type==="splitter"||type==="merger"||type==="smart_splitter")&&cell[y][x]&&cell[y][x].t==="belt")return spliceOnBelt(type,x,y);
  return makeNode(type,x,y,recipeId); }

// ---------------------------------------------------------------- DELETE (buildings + belts)
// Note: since ports are now derived live from the belts array (no more per-good outBelt/inBelt bookkeeping —
// see the multi-good belt rewrite above), deleting a belt needs no port cleanup at all beyond removing it.
function deleteBelt(beltId){
  const idx=belts.findIndex(be=>be.id===beltId); if(idx<0)return false;
  const be=belts[idx];
  for(let i=0;i<be.path.length;i++){ const[x,y]=be.path[i];
    if(be.cross&&be.cross[i]){ if(crossings[y*GW+x]===beltId)delete crossings[y*GW+x]; }
    else if(cell[y]&&cell[y][x]&&cell[y][x].t==="belt"&&cell[y][x].id===beltId){ cell[y][x]=null; }
  }
  belts.splice(idx,1);
  return true;
}
function deleteBuilding(nodeId){
  const b=nodes[nodeId]; if(!b)return false;
  const touching=belts.filter(be=>be.src===nodeId||be.dst===nodeId).map(be=>be.id);
  for(const id of touching)deleteBelt(id);
  delete nodes[nodeId];
  if(b.type==="extractor"){ const dep=deposits.find(d=>d.x===b.x&&d.y===b.y); cell[b.y][b.x]=dep?{t:"dep",d:dep}:null; }
  else cell[b.y][b.x]=null;
  return true;
}
// ---------------------------------------------------------------- RECIPE CHANGE (in place, no rebuild)
function changeRecipe(nodeId,recipeId){
  const b=nodes[nodeId]; if(!b)return{err:"missing"};
  if(!PROC.has(b.type))return{err:"This building has no recipe to change"};
  if(inBeltCount(b)>0||outBeltCount(b)>0)return{err:"Disconnect its belts first (Delete tool), then change the recipe"};
  const r=RECIPES[recipeId]; if(!r||r.b!==b.type)return{err:"Not a valid recipe for this building"};
  b.recipeId=recipeId; b.inBuf={}; b.outBuf={}; b.util=0; b.working=false; b.stalled=false;
  r.in.forEach(([g])=>b.inBuf[g]=0); r.out.forEach(([g])=>b.outBuf[g]=0);
  return{ok:true};
}

// ---------------------------------------------------------------- RENDER
const c=document.getElementById("c"), ctx=c.getContext("2d");
let CS=40, OX=0, OY=0; // cell size + origin
function resize(){ const w=c.clientWidth, h=c.clientHeight; c.width=w; c.height=h;
  CS=Math.min(Math.floor(w/GW), Math.floor(h/GH)); OX=(w-CS*GW)/2; OY=(h-CS*GH)/2; }
function gx(px){ return Math.floor((px-OX)/CS); } function gy(py){ return Math.floor((py-OY)/CS); }
function cx(x){ return OX+x*CS+CS/2; } function cy(y){ return OY+y*CS+CS/2; }
// Passive info shields (playtest round 1, fix #2): at a real mobile cell size (CS often ~24-30px on a phone
// screen, well below the CS=40 desktop default this was originally tuned against), a pure CS-proportional font
// shrinks to 4-5px and is functionally unreadable — this is very likely the root cause behind the #1 unanimous
// playtest complaint ("can't tell what's on the grid"), since building labels already existed in code but were
// too small to read, and deposits had no text label at all (just an unlabeled color-coded circle). fLabel()
// floors every on-grid label at a legible minimum regardless of how small the cell size gets.
function fLabel(scale,weight){ return `${weight||""} ${Math.max(9,Math.round(CS*scale))}px sans-serif`.trim(); }
// Verified via screenshot at a 420x800 mobile viewport (real small CS): flooring the font size fixed the
// "too small to read" problem but created a new one — a floored-size label like "Extractor" is often wider
// than the building's own cell, so it overflows onto the black canvas background. The label fill color
// (#0d1015, near-black) is chosen for contrast against the light/mid-tone building box, which makes the
// overflowing portion effectively invisible against black. A light outline keeps the same dark fill legible
// on the box while also making the overflow readable on black — same "outline + fill" trick already used for
// deposit ore-name labels.
function lblText(s,tx,ty){ ctx.lineWidth=Math.max(1.5,CS*0.05); ctx.strokeStyle="rgba(232,236,241,.85)"; ctx.strokeText(s,tx,ty); ctx.fillText(s,tx,ty); }
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  // grid
  ctx.strokeStyle="var(--grid)"; ctx.strokeStyle="#1d2430"; ctx.lineWidth=1;
  for(let x=0;x<=GW;x++){ctx.beginPath();ctx.moveTo(OX+x*CS,OY);ctx.lineTo(OX+x*CS,OY+GH*CS);ctx.stroke();}
  for(let y=0;y<=GH;y++){ctx.beginPath();ctx.moveTo(OX,OY+y*CS);ctx.lineTo(OX+GW*CS,OY+y*CS);ctx.stroke();}
  // deposits — fully invisible until Scanned (discovered)
  for(const d of deposits){ if(!d.discovered)continue; if(cell[d.y][d.x].t==="dep"){ ctx.globalAlpha=.5; ctx.fillStyle=ITEMS[d.good].c;
      ctx.beginPath(); ctx.arc(cx(d.x),cy(d.y),CS*0.32,0,6.29); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle="#0d1015"; ctx.font=fLabel(0.2,"bold"); ctx.textAlign="center";
      ctx.fillText("◆".repeat(d.rich),cx(d.x),cy(d.y)+CS*0.07);
      // passive info shield: the ore name itself, not just its color — a color-coded circle alone tells you
      // nothing unless you already have every good's color memorized, which is exactly what testers reported
      ctx.fillStyle="#e8ecf1"; ctx.font=fLabel(0.17,"bold"); ctx.textAlign="center";
      ctx.strokeStyle="#0d1015"; ctx.lineWidth=Math.max(2,CS*0.05);
      const depName=ITEMS[d.good].n.split(" ")[0];
      ctx.strokeText(depName,cx(d.x),cy(d.y)-CS*0.36); ctx.fillText(depName,cx(d.x),cy(d.y)-CS*0.36); } }
  // scan-select rectangle preview (drag in progress)
  if(mode==="scan"&&scanning&&scanStart){ const x1=Math.min(scanStart[0],scanEnd[0]), x2=Math.max(scanStart[0],scanEnd[0]);
    const y1=Math.min(scanStart[1],scanEnd[1]), y2=Math.max(scanStart[1],scanEnd[1]);
    ctx.strokeStyle="#4fd1c5"; ctx.fillStyle="rgba(79,209,197,.12)"; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    ctx.fillRect(OX+x1*CS,OY+y1*CS,(x2-x1+1)*CS,(y2-y1+1)*CS);
    ctx.strokeRect(OX+x1*CS,OY+y1*CS,(x2-x1+1)*CS,(y2-y1+1)*CS); ctx.setLineDash([]); }
  // belts
  for(const be of belts){ const pts=be.path.map(([x,y])=>[cx(x),cy(y)]);
    // connect from src edge to first, and last to dst edge
    const s=nodes[be.src], d=nodes[be.dst];
    const full=[[cx(s.x),cy(s.y)],...pts,[cx(d.x),cy(d.y)]];
    ctx.strokeStyle=be.tier===2?"#3f6a7f":"#39424f"; ctx.lineWidth=be.tier===2?CS*0.4:CS*0.34; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(full[0][0],full[0][1]); for(let i=1;i<full.length;i++)ctx.lineTo(full[i][0],full[i][1]); ctx.stroke();
    // stall tint if dst input full
    // sprites
    for(const sp of be.sprites){ const P=lerpPath(full,sp.p); ctx.fillStyle=ITEMS[sp.g]?ITEMS[sp.g].c:"#ccc";
      ctx.beginPath(); ctx.arc(P[0],P[1],CS*0.11,0,6.29); ctx.fill(); }
  }
  // Elevator Overpass crossing markers — a belt passes over another belt's cell here (mechanics-spec.md §1.4)
  for(const key in crossings){ const k=+key; const x=k%GW, y=(k-x)/GW;
    ctx.fillStyle="rgba(143,127,224,.9)"; ctx.strokeStyle="#0d1015"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx(x),cy(y),CS*0.22,0,6.29); ctx.fill(); ctx.stroke();
    ctx.strokeStyle="#0d1015"; ctx.lineWidth=CS*0.07; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(cx(x)-CS*0.14,cy(y)-CS*0.14); ctx.lineTo(cx(x)+CS*0.14,cy(y)+CS*0.14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx(x)+CS*0.14,cy(y)-CS*0.14); ctx.lineTo(cx(x)-CS*0.14,cy(y)+CS*0.14); ctx.stroke();
  }
  // buildings
  for(const id in nodes){ const b=nodes[id]; if(b.type==="generator"){drawGen(b);continue;} drawBld(b); }
  // pending connect highlight
  if(mode==="belt"&&beltSrc!=null){ const s=nodes[beltSrc];
    ctx.strokeStyle="#4fd1c5"; ctx.lineWidth=2; ctx.setLineDash([5,4]);
    ctx.strokeRect(OX+s.x*CS+3,OY+s.y*CS+3,CS-6,CS-6); ctx.setLineDash([]);
    if(beltPath.length){ // in-progress manually-drawn path, dashed teal preview with a dot on the current tail
      const pts=[[cx(s.x),cy(s.y)],...beltPath.map(([px,py])=>[cx(px),cy(py)])];
      ctx.strokeStyle="#4fd1c5"; ctx.lineWidth=CS*0.2; ctx.lineJoin="round"; ctx.lineCap="round"; ctx.globalAlpha=.55;
      ctx.setLineDash([CS*0.15,CS*0.12]);
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      const tail=beltPath[beltPath.length-1];
      ctx.fillStyle="#4fd1c5"; ctx.beginPath(); ctx.arc(cx(tail[0]),cy(tail[1]),CS*0.12,0,6.29); ctx.fill();
      // pending Elevator Overpass crossings in this in-progress path
      ctx.strokeStyle="#8f7fe0"; ctx.lineWidth=CS*0.05; ctx.lineCap="round";
      for(let i=0;i<beltPath.length;i++){ if(!beltPathCross[i])continue; const[px,py]=beltPath[i];
        ctx.beginPath(); ctx.moveTo(cx(px)-CS*0.15,cy(py)-CS*0.15); ctx.lineTo(cx(px)+CS*0.15,cy(py)-CS*0.15); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx(px)-CS*0.15,cy(py)+CS*0.15); ctx.lineTo(cx(px)+CS*0.15,cy(py)+CS*0.15); ctx.stroke();
      }
    } }
}
function lerpPath(pts,t){ // t 0..1 across whole polyline
  let tot=0; const segs=[]; for(let i=1;i<pts.length;i++){ const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); tot+=d; }
  let dd=t*tot; for(let i=0;i<segs.length;i++){ if(dd<=segs[i]){ const f=segs[i]>0?dd/segs[i]:0; return[pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f]; } dd-=segs[i]; } return pts[pts.length-1]; }
function drawBld(b){ const x=OX+b.x*CS, y=OY+b.y*CS, meta=BUILD[b.type];
  ctx.fillStyle=b.stalled?"#3a2422":meta.color; ctx.fillRect(x+2,y+2,CS-4,CS-4);
  ctx.strokeStyle=b.stalled?"#e0554f":"rgba(255,255,255,.15)"; ctx.lineWidth=b.stalled?2:1; ctx.strokeRect(x+2.5,y+2.5,CS-5,CS-5);
  ctx.fillStyle="#0d1015"; ctx.textAlign="center"; ctx.font=fLabel(0.18,"bold");
  let label=meta.label.split(" ")[0]; if(b.type==="smelter")label="Smelt"; if(b.recipeId&&b.type!=="smelter")label=RECIPES[b.recipeId].name.split(" ")[0];
  lblText(label,x+CS/2,y+CS*0.42);
  ctx.font=fLabel(0.15);
  if(b.type==="extractor")lblText("T"+b.tier+" "+Math.round(b.rate)+"/m",x+CS/2,y+CS*0.62);
  else if(b.recipeId)lblText(Math.round(b.util*100)+"%",x+CS/2,y+CS*0.62);
  else if(b.type==="terminal"){ const need=currentTierNeed(); const met=need.filter(([g,q])=>(tierProgress[g]||0)>=q).length;
    lblText(techTier>=TIERS.length?"MAX":met+"/"+need.length+" goods",x+CS/2,y+CS*0.62); }
  else if(b.type==="splitter")lblText("1→3 "+Math.round(bufTotal(b)),x+CS/2,y+CS*0.62);
  else if(b.type==="merger")lblText(inBeltCount(b)+"→1 "+Math.round(bufTotal(b)),x+CS/2,y+CS*0.62);
  else if(b.type==="smart_splitter")lblText(inBeltCount(b)+"→"+outBeltCount(b),x+CS/2,y+CS*0.62);
  else if(b.type==="storageroom")lblText(Math.round(bufTotal(b))+"/"+BIGCAP,x+CS/2,y+CS*0.62);
  // buffer gauges
  if(b.type!=="splitter"&&b.type!=="terminal"&&b.type!=="merger"&&b.type!=="storageroom"&&b.type!=="smart_splitter"){ const outs=Object.keys(b.outBuf); if(outs.length){ const g=outs[0];
    gauge(x+CS-6,y+4,4,CS-8,(b.outBuf[g]||0)/CAP,ITEMS[g].c); }
    const ins=Object.keys(b.inBuf); if(ins.length){ gauge(x+2,y+4,4,CS-8,(b.inBuf[ins[0]]||0)/CAP,"#d9a441"); } }
  if(b.stalled){ctx.fillStyle="#e0554f";ctx.font=fLabel(0.13,"bold");lblText("STALL",x+CS/2,y+CS*0.8);}
}
function drawGen(b){ const x=OX+b.x*CS,y=OY+b.y*CS; ctx.fillStyle=brownout?"#3a2422":"#c8b04a"; ctx.fillRect(x+2,y+2,CS-4,CS-4);
  ctx.fillStyle="#0d1015";ctx.textAlign="center";ctx.font=fLabel(0.3,"bold");ctx.fillText("⚡",x+CS/2,y+CS*0.55);
  ctx.font=fLabel(0.14);lblText("tap",x+CS/2,y+CS*0.78); }
function gauge(x,y,w,h,f,col){ f=Math.max(0,Math.min(1,f)); ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(x,y,w,h);
  ctx.fillStyle=col;ctx.fillRect(x,y+h*(1-f),w,h*f); }

// ---------------------------------------------------------------- ANALYZE
function updateAnalyze(){ const el=document.getElementById("analyzeBody"); if(!document.getElementById("analyze").classList.contains("show"))return;
  let h=""; for(const id in nodes){ const b=nodes[id]; if(b.type==="generator")continue;
    let rate="",sub="";
    if(b.type==="extractor"){ rate=Math.round(b.outBuf[b.good]>=CAP?0:b.rate)+"/m"; sub="out "+Math.round(b.outBuf[b.good])+"/"+CAP; }
    else if(b.type==="terminal"){ const need=currentTierNeed();
      if(techTier>=TIERS.length){ rate="MAX TIER"; sub="all defined tiers complete"; }
      else { rate=`Tier ${techTier+1} · ${TIERS[techTier].name}`; sub=need.map(([g,q])=>`${Math.min(tierProgress[g]||0,q)}/${q} ${ITEMS[g].n}`).join(", "); } }
    else if(b.type==="splitter"){ rate=bufSummary(b); sub="1→"+outBeltCount(b); }
    else if(b.type==="merger"){ rate=bufSummary(b); sub=inBeltCount(b)+"→1"; }
    else if(b.type==="smart_splitter"){ rate=bufSummary(b); sub=inBeltCount(b)+" in · "+outBeltCount(b)+" out"; }
    else if(b.type==="storageroom"){ rate=Math.round(bufTotal(b))+"/"+BIGCAP; sub=bufSummary(b); }
    else{ const r=RECIPES[b.recipeId]; const og=r.out[0]; rate=Math.round(b.util*rpm(og[1],r.sec))+"/m "+Math.round(b.util*100)+"%";
      sub="in "+Math.round(b.inBuf[r.in[0][0]])+" · out "+Math.round(b.outBuf[og[0]]); }
    const nm=(b.recipeId&&b.type!=="smelter")?RECIPES[b.recipeId].name:BUILD[b.type].label;
    h+=`<div class="b">${nm} ${b.stalled?'<span style="color:#e0554f">STALL</span>':''}</div><div class="r"><span class="k">${rate}</span><span class="sub">${sub}</span></div>`;
  }
  h+=`<div class="b" style="margin-top:6px">Power</div><div class="r"><span class="k">${Math.round(battery)}/${CFG.batteryCap} kW</span><span class="sub">${brownout?'BROWNOUT':'ok'}</span></div>`;
  el.innerHTML=h;
}

// ---------------------------------------------------------------- INPUT / UI
let mode=null, placeType=null, beltSrc=null, beltPath=[], beltPathCross=[], pendingPlace=null, beltTier=1;
let scanning=false, scanStart=null, scanEnd=null;
const hint=document.getElementById("hint");
function setHint(t,cls){ hint.innerHTML=t; hint.className=cls||""; }
// First-run discoverability hint (playtest round 1, fix #3): the tap-for-building-info panel and the
// tap-for-tier-progress panel both already existed (fourth session) but none of the 3 testers ever found
// either one — nothing in the UI ever told them the interaction exists. Rather than a separate tutorial
// overlay (more surface area, more to maintain), this piggybacks on the very first successful building
// placement's own hint message, which is a moment every player reaches early and reads. Fires once, ever,
// persisted so returning players don't see it again.
let hintSeen=false; try{ hintSeen=localStorage.getItem("lineBalance_hintSeen_v1")==="1"; }catch(e){}
function placedHint(baseMsg){

  hintSeen=true; try{ localStorage.setItem("lineBalance_hintSeen_v1","1"); }catch(e){}

}
function buildPalette(){ const P=document.getElementById("palette"); P.innerHTML="";
  const items=[["extractor",true],["smelter",true],["fabricator",true],["terminal",true],["alloy_foundry",tierUnlocked("alloy_foundry")],["assembly_station",tierUnlocked("assembly_station")],["manufactory",tierUnlocked("manufactory")],["splitter",tierUnlocked("splitter")],["merger",tierUnlocked("merger")],["smart_splitter",tierUnlocked("smart_splitter")],["storageroom",tierUnlocked("storageroom")],["generator",true],["belt1",true],["belt2",tierUnlocked("belt2")],["scan",true],["analyze",true],["contracts",true],["delete",true]];
  for(const[t,en]of items){ const btn=document.createElement("button"); btn.className="tool"; btn.dataset.t=t;
    if(t==="belt1")btn.innerHTML="Belt T1<small>"+CFG.beltCap.t1+"/m</small>"; else if(t==="belt2")btn.innerHTML="Belt T2<small>"+CFG.beltCap.t2+"/m</small>"; else if(t==="scan")btn.innerHTML="Scan<small>reveal area</small>"; else if(t==="analyze")btn.innerHTML="Analyze<small>rates</small>"; else if(t==="delete")btn.innerHTML="Delete<small>remove tap</small>"; else if(t==="contracts")btn.innerHTML="Contracts<small>quotas</small>";
    else btn.innerHTML=BUILD[t].label.replace(" ","<br>")+`<small>${BUILD[t].sub}</small>`;

function selectTool(t,btn){ document.querySelectorAll(".tool").forEach(b=>b.classList.remove("active"));
  if(t==="analyze"){ document.getElementById("contractsPanel").classList.remove("show"); const a=document.getElementById("analyze"); a.classList.toggle("show"); if(a.classList.contains("show"))btn.classList.add("active"); mode=null; placeType=null; beltSrc=null; beltPath=[]; beltPathCross=[]; return; }
  if(t==="contracts"){ document.getElementById("analyze").classList.remove("show"); const cp=document.getElementById("contractsPanel"); cp.classList.toggle("show"); if(cp.classList.contains("show")){ btn.classList.add("active"); updateContractsPanel(); } mode=null; placeType=null; beltSrc=null; beltPath=[]; beltPathCross=[]; return; }
  btn.classList.add("active"); beltSrc=null; beltPath=[]; beltPathCross=[];
  if(t==="belt1"||t==="belt2"){ mode="belt"; beltTier=(t==="belt2")?2:1;
    const crossNote=tierUnlocked("elevator")?" Tap onto another belt to cross it with an Elevator Overpass instead of routing around.":"";
    setHint(`Belt T${beltTier} (${CFG.beltCap["t"+beltTier]}/m): tap a <b>source</b> building, then tap cell-by-cell toward a <b>destination</b>. Belts can't cross buildings — you route around by hand.${crossNote}`); }
  else if(t==="scan"){ mode="scan"; scanning=false; scanStart=null; setHint("Scan: drag a box over the map to reveal any ore deposits hidden inside it."); }
  else if(t==="delete"){ mode="delete"; setHint("Delete: tap a building or a belt cell to remove it. This also clears anything wired directly to it."); }
  else if(t==="splitter"||t==="merger"||t==="smart_splitter"){ mode="place"; placeType=t; setHint(`Tap an empty cell, or tap an existing belt to splice the ${BUILD[t].label} into it.`); }
  else { mode="place"; placeType=t; setHint(`Tap a ${t==="extractor"?"faint ore deposit":"grid cell"} to place the ${BUILD[t].label}.`); } }
c.addEventListener("pointerdown",e=>{ e.preventDefault();
  // Android bug fix (playtest round 1, tester 3): without this, some Android/Chrome builds still fire a
  // synthetic compatibility "click" for the same touch right after this handler runs. If that handler opened
  // a centered modal (e.g. the Fabricator recipe picker), the ghost click can land on whichever "opt" button
  // happens to sit at the original tap's screen coordinates, silently choosing it and closing the modal —
  // looks to the player like "the menu flashed and disappeared." preventDefault() on pointerdown suppresses
  // the compatibility click for the touch that triggered it; the modal buttons' own onclick handlers still
  // fire normally for the player's real, separate tap on them.
  const r=c.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top;
  const x=gx(px), y=gy(py); if(x<0||x>=GW||y<0||y>=GH)return;
  const cc=cell[y][x];
  if(mode==="place"){
    if(placeType==="generator"&&cc&&cc.t==="bld"&&nodes[cc.id].type==="generator"){ pulseGen(nodes[cc.id]); return; }
    if(!canPlace(placeType,x,y)){ setHint(placeType==="extractor"?"Extractors go on ore deposits (the faint ◆ circles).":"That cell is occupied.","warn"); return; }
    if(PROC.has(placeType)){ askRecipe(placeType,x,y); return; }
    if(placeType==="extractor"){ askExtractorTier(x,y); return; }
    const b=place(placeType,x,y); if(b)setHint(placedHint(`${BUILD[placeType].label} placed.`),"ok");
  } else if(mode==="belt"){
    // Manual belt drawing: tap a source building, then tap adjacent empty cells one at a time to extend
    // the belt, then tap an adjacent destination to finish. Tap the last-placed cell again to undo it;
    // re-tap the source (with nothing drawn yet) to cancel.
    if(beltSrc==null){
      if(cc&&cc.t==="bld"){ beltSrc=cc.id; beltPath=[]; beltPathCross=[]; setHint(`From <b>${nodeName(nodes[cc.id])}</b> — tap an adjacent cell to start laying belt, or tap an adjacent building to connect directly.`); }
      else setHint("Tap a building to start a belt from its output.","warn");
    } else {
      const s=nodes[beltSrc];
      const tailX=beltPath.length?beltPath[beltPath.length-1][0]:s.x, tailY=beltPath.length?beltPath[beltPath.length-1][1]:s.y;
      const adjToTail=Math.abs(tailX-x)+Math.abs(tailY-y)===1;
      if(cc&&cc.t==="bld"&&cc.id===beltSrc&&beltPath.length===0){
        beltSrc=null; setHint("Belt cancelled.");
      } else if(beltPath.length&&x===beltPath[beltPath.length-1][0]&&y===beltPath[beltPath.length-1][1]){
        beltPath.pop(); beltPathCross.pop(); setHint(beltPath.length?`Undid last cell — ${beltPath.length} left.`:`Back to <b>${nodeName(s)}</b> — tap an adjacent cell.`);
      } else if(cc&&cc.t==="bld"){
        if(!adjToTail){ setHint("That building isn't adjacent to your last belt cell yet — keep drawing toward it.","warn"); }
        else { const res=connect(beltSrc,cc.id,beltTier,beltPath.slice(),undefined,beltPathCross.slice());
          const bsrc=beltSrc, bpath=beltPath.slice(), bcross=beltPathCross.slice(), btier=beltTier;
          if(res.err==="AMBIGUOUS_GOOD"){ beltSrc=null; beltPath=[]; beltPathCross=[]; askOutputFilter(bsrc,cc.id,btier,bpath,res.candidates,bcross); }
          else if(res.err){ setHint("⚠ "+res.err,"warn"); beltSrc=null; beltPath=[]; beltPathCross=[]; }
          else { setHint(`Belt T${beltTier} connected (${beltPath.length} cell${beltPath.length===1?'':'s'}).`,"ok"); beltSrc=null; beltPath=[]; beltPathCross=[]; } }
      } else if(!cc){
        if(!adjToTail){ setHint("Next belt cell must be adjacent to the last one you placed.","warn"); }
        else { beltPath.push([x,y]); beltPathCross.push(false); setHint(`Laying belt — ${beltPath.length} cell${beltPath.length===1?'':'s'} so far. Tap an adjacent destination to finish, or keep extending.`); }
      } else if(cc.t==="belt"){
        // Elevator Overpass: crossing over another belt instead of routing around (mechanics-spec.md §1.4), Tier 2+
        if(!tierUnlocked("elevator")){ setHint("Belts can't cross each other yet — Elevator Overpass unlocks at Tier 2. Route around for now.","warn"); }
        else if(!adjToTail){ setHint("That belt cell isn't adjacent to your last placed cell yet — keep drawing toward it.","warn"); }
        else if(crossings[y*GW+x]){ setHint("There's already an overpass crossing that cell — pick a different cell to cross, or route around.","warn"); }
        else { beltPath.push([x,y]); beltPathCross.push(true); setHint(`Elevator Overpass — crossing over the belt below (${beltPath.length} cell${beltPath.length===1?'':'s'} so far). Keep drawing, or tap an adjacent destination to finish.`,"ok"); }
      } else { setHint("Belts can't cross buildings or deposits — route around.","warn"); }
    }
  } else if(mode==="scan"){
    scanning=true; scanStart=[x,y]; scanEnd=[x,y];
  } else if(mode==="delete"){
    if(cc&&cc.t==="bld"){ const nm=nodeName(nodes[cc.id]); deleteBuilding(cc.id); setHint(`${nm} removed.`,"ok"); }
    else if(cc&&cc.t==="belt"){ deleteBelt(cc.id); setHint("Belt removed.","ok"); }
    else { setHint("Tap a building or belt to delete it.","warn"); }
  } else {
    // no tool active: tap a generator to pulse it, tap any other building to see what it's doing, tap a belt for a quick readout
    if(cc&&cc.t==="bld"){
      if(nodes[cc.id].type==="generator")pulseGen(nodes[cc.id]);
      else showBuildingInfo(cc.id);
    } else if(cc&&cc.t==="belt"){
      const be=belts.find(bl=>bl.id===cc.id);
      if(be){ const goods=Object.keys(be.mix||{}).filter(g=>be.mix[g]>1e-6);
        const carrying=goods.length?goods.map(g=>ITEMS[g].n+" "+Math.round(be.mix[g]*60/CFG.dt/CFG.rateScale)+"/m").join(", "):"nothing right now";
        setHint(`Belt T${be.tier} (${be.cap}/m cap) — carrying <b>${carrying}</b>, ${Math.round(be.flow)}/m total.`); }
    }
  }
});

function buildingInfoRows(b){ const rows=[];
  if(b.type==="extractor"){
    rows.push(["Tier","T"+b.tier]); rows.push(["Rate",Math.round(b.rate)+"/m"]);
    rows.push(["Output",ITEMS[b.good].n]); rows.push(["Buffer",Math.round(b.outBuf[b.good]||0)+"/"+CAP]);

  } else if(PROC.has(b.type)){
    const r=RECIPES[b.recipeId];
    rows.push(["Recipe",r.name]);
    rows.push(["Inputs",r.in.map(([g,q])=>`${q}× ${ITEMS[g].n} (have ${Math.round(b.inBuf[g]||0)})`).join(", ")]);
    rows.push(["Outputs",r.out.map(([g,q])=>`${q}× ${ITEMS[g].n} (have ${Math.round(b.outBuf[g]||0)}/${CAP})`).join(", ")]);
    rows.push(["Rate",Math.round(b.util*rpm(r.out[0][1],r.sec))+"/m ("+Math.round(b.util*100)+"%)"]);
    rows.push(["Power draw",POWER[b.type]+" kW while working"]);
    rows.push(["Status",b.stalled?"STALLED":(b.working?"working":"idle")]);
  } else if(b.type==="splitter"){
    rows.push(["Carrying",bufSummary(b)]); rows.push(["Buffer total",Math.round(bufTotal(b))+"/"+(CAP*3)]);
    rows.push(["Ports",`${inBeltCount(b)}/1 in · ${outBeltCount(b)}/3 out`]);
    rows.push(["Note","Splits everything on its input belt proportionally across its live outputs — it doesn't filter by good. Use a Smart Splitter to route specific goods."]);
  } else if(b.type==="merger"){
    rows.push(["Carrying",bufSummary(b)]); rows.push(["Buffer total",Math.round(bufTotal(b))+"/"+(CAP*3)]);
    rows.push(["Ports",`${inBeltCount(b)}/3 in · ${outBeltCount(b)}/1 out`]);
    rows.push(["Note","Combines every good from all its inputs onto one output belt."]);
  } else if(b.type==="smart_splitter"){
    rows.push(["Buffered goods",bufSummary(b)]);
    rows.push(["Ports",`${inBeltCount(b)}/3 in (any goods) · ${outBeltCount(b)}/3 out (each routes one good, or "everything else")`]);
    const filters=belts.filter(be=>be.src===b.id).map(be=>be.filterGood);
    if(filters.length)rows.push(["Routing",filters.map(f=>f===ELSE?"everything else":(ITEMS[f]?ITEMS[f].n:f)).join(", ")]);
  } else if(b.type==="storageroom"){
    rows.push(["Holding",bufSummary(b)]); rows.push(["Buffer total",Math.round(bufTotal(b))+"/"+BIGCAP]);
  } else if(b.type==="terminal"){
    const need=currentTierNeed();
    if(techTier>=TIERS.length){ rows.push(["Status","All defined tiers complete"]); }
    else{ rows.push(["Tier",`${techTier+1} · ${TIERS[techTier].name}`]);
      for(const[g,q]of need)rows.push([ITEMS[g].n,`${Math.min(tierProgress[g]||0,q)}/${q}`]); }
  }
  return rows; }
